# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# The name of the backend service.
# This is used to identify the backend in the Firebase console.
serviceId: default

# The region to deploy the backend to.
# This should be a region that supports App Hosting.
region: us-central1

# Environment variables to pass to the backend.
# You can add your Firebase project's environment variables here.
env:
  - variable: 'NODE_ENV'
    value: 'production'
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyABDTJq_xSOUGLwVlR_deeIpi5rFZ4ZPUE"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "studio-1397195000-3cb07.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "studio-1397195000-3cb07"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "659800845261"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:659800845261:web:23ddaeafe5711c8b65f284"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: "https://saturnsync.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: RESEND_API_KEY
    value: "re_hfnUftgP_LxQrEY7o8aEKeHUumQfM1Zqw"
