# The build command for the Next.js app.
# This is used to build the production version of the app.
buildCommand: npm ci && npm run build

# The command to run the Next.js app.
# This is used to start the server in production.
startCommand: npm start

# The runtime configuration for the Cloud Run instance.
runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
